name: Build Flutter AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create fresh project
        run: flutter create --org com.apnachetr --project-name apna_chhetr --platforms android temp_app

      - name: Copy main.dart and pubspec.yaml
        run: |
          cp lib/main.dart temp_app/lib/main.dart
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Copy AndroidManifest.xml
        run: |
          cp android_config/AndroidManifest.xml temp_app/android/app/src/main/AndroidManifest.xml

      - name: Update Gradle settings for WebView
        working-directory: temp_app
        run: |
          # 1. Update minSdkVersion to 21 (WebView के लिए जरूरी)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          
          # 2. Update compileSdkVersion
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          
          # 3. Enable multidex
          sed -i 's/multiDexEnabled true/multiDexEnabled true/' android/app/build.gradle
          
          echo "=== build.gradle content ==="
          cat android/app/build.gradle

      - name: Get deps
        working-directory: temp_app
        run: flutter pub get

      - name: Build AAB
        working-directory: temp_app
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: temp_app/build/app/outputs/bundle/release/app-release.aab

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
