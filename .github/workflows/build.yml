name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable

      - name: Create Fresh Flutter Project
        run: |
          flutter create \
            --org com.apnachetr \
            --project-name apna_chhetr_test \
            --platforms android \
            test_app

      - name: Build Test APK
        working-directory: test_app
        run: flutter build apk --release

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: apna-chetr-test-apk
          path: test_app/build/app/outputs/flutter-apk/app-release.apk
