name: Build Apna Chhetr APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.apnachetr \
            --project-name apna_chhetr \
            --platforms android \
            temp_app

      - name: Copy App Files
        run: |
          cp lib/main.dart temp_app/lib/main.dart
          cp pubspec.yaml temp_app/pubspec.yaml
          cp android_config/AndroidManifest.xml temp_app/android/app/src/main/AndroidManifest.xml

      - name: Configure Android
        working-directory: temp_app
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle

      - name: Flutter Pub Get
        working-directory: temp_app
        run: flutter pub get

      - name: Analyze
        working-directory: temp_app
        run: flutter analyze

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apna-Chhetr-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
